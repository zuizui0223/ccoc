name: Canonical boundary blanket certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/canonical_boundary_blankets.py'
      - 'scripts/verify_canonical_boundary_blankets.py'
      - 'tests/test_canonical_boundary_blankets.py'
      - 'docs/canonical_boundary_blankets.md'
      - '.github/workflows/canonical-boundary-blankets.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/canonical_boundary_blankets.py'
      - 'scripts/verify_canonical_boundary_blankets.py'
      - 'tests/test_canonical_boundary_blankets.py'
      - 'docs/canonical_boundary_blankets.md'
      - '.github/workflows/canonical-boundary-blankets.yml'

permissions:
  contents: read

jobs:
  theorem-layers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: canonical_minimality
            selector: redundant or summary or response_table or grammar_validation
          - layer: interface_observability
            selector: empty_grammar or joint_observability
          - layer: grammar_refinement
            selector: grammar_chain or addressable_ladder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replay theorem layer
        run: >-
          python -m pytest tests/test_canonical_boundary_blankets.py -q
          -k "${{ matrix.selector }}"

  certificate-replay:
    needs: theorem-layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_canonical_boundary_blankets.py
          --max-addressable-bits 6
          --output artifacts/canonical_boundary_blankets_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: canonical-boundary-blankets-report
          path: artifacts/canonical_boundary_blankets_report.json
          if-no-files-found: error
