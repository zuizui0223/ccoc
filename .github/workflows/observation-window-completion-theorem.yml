name: Observation-window completion theorem regression

on:
  pull_request:
    paths:
      - 'causal_model/observation_window_completion.py'
      - 'causal_model/extension_compression.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'scripts/verify_observation_window_completion.py'
      - 'tests/test_observation_window_completion.py'
      - 'docs/observation_window_completion.md'
      - '.github/workflows/observation-window-completion-theorem.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/observation_window_completion.py'
      - 'causal_model/extension_compression.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'scripts/verify_observation_window_completion.py'
      - 'tests/test_observation_window_completion.py'
      - 'docs/observation_window_completion.md'
      - '.github/workflows/observation-window-completion-theorem.yml'

permissions:
  contents: read

jobs:
  finite-window-completion-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install theorem regression dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run observation-window completion tests
        run: python -m pytest tests/test_observation_window_completion.py -q
      - name: Verify finite observation-window completion family
        run: >-
          PYTHONPATH=. python scripts/verify_observation_window_completion.py
          --max-module-count 6
          --passive-horizon 6
          --output artifacts/observation_window_completion_report.json
      - name: Upload observation-window theorem report
        uses: actions/upload-artifact@v4
        with:
          name: observation-window-completion-report
          path: artifacts/observation_window_completion_report.json
          if-no-files-found: error
