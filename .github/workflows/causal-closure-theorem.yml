name: Causal closure theorem regression

on:
  pull_request:
    paths:
      - 'causal_model/causal_closure_calculus.py'
      - 'scripts/verify_causal_closure_theorems.py'
      - 'tests/test_causal_closure_calculus.py'
      - '.github/workflows/causal-closure-theorem.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/causal_closure_calculus.py'
      - 'scripts/verify_causal_closure_theorems.py'
      - 'tests/test_causal_closure_calculus.py'
      - '.github/workflows/causal-closure-theorem.yml'

permissions:
  contents: read

jobs:
  exhaustive-finite-theorem-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run targeted certificate tests
        run: python -m pytest tests/test_causal_closure_calculus.py -q
      - name: Exhaustively check finite theorem domain
        run: >-
          python scripts/verify_causal_closure_theorems.py
          --max-state-count 4
          --output artifacts/causal_closure_exhaustive_report.json
      - name: Upload theorem regression report
        uses: actions/upload-artifact@v4
        with:
          name: causal-closure-exhaustive-report
          path: artifacts/causal_closure_exhaustive_report.json
          if-no-files-found: error
