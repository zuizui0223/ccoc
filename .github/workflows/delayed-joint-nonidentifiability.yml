name: Delayed joint nonidentifiability certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/delayed_joint_nonidentifiability.py'
      - 'causal_model/delayed_addressability.py'
      - 'causal_model/joint_open_candidate_laws.py'
      - 'scripts/verify_delayed_joint_nonidentifiability.py'
      - 'tests/test_delayed_joint_nonidentifiability.py'
      - 'tests/test_current_theory.py'
      - 'docs/delayed_joint_nonidentifiability.md'
      - '.github/workflows/delayed-joint-nonidentifiability.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/delayed_joint_nonidentifiability.py'
      - 'causal_model/delayed_addressability.py'
      - 'causal_model/joint_open_candidate_laws.py'
      - 'scripts/verify_delayed_joint_nonidentifiability.py'
      - 'tests/test_delayed_joint_nonidentifiability.py'
      - 'tests/test_current_theory.py'
      - 'docs/delayed_joint_nonidentifiability.md'
      - '.github/workflows/delayed-joint-nonidentifiability.yml'

permissions:
  contents: read

jobs:
  certificate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run delayed joint theorem tests
        run: python -m pytest tests/test_delayed_joint_nonidentifiability.py -q
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_delayed_joint_nonidentifiability.py
          --max-exterior-port-count 3
          --max-delay 4
          --output artifacts/delayed_joint_nonidentifiability_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: delayed-joint-nonidentifiability-report
          path: artifacts/delayed_joint_nonidentifiability_report.json
          if-no-files-found: error
