name: Legacy addressable-completion replay

# This companion witness is retained for historical comparison. The manuscript
# uses operational_addressability.py and the dedicated Paper-core reproducibility
# workflow instead. Run this workflow explicitly when maintaining the archive.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-certificate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install certificate replay dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replay archived theorem certificates
        run: python -m pytest -m legacy tests/test_addressable_completion_bounds.py -q
      - name: Replay archived binary and nonbinary product certificates
        run: >-
          PYTHONPATH=. python scripts/verify_addressable_completion_bounds.py
          --max-exterior-count 6
          --output artifacts/addressable_completion_bounds_report.json
      - name: Upload archived certificate replay report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-addressable-completion-bounds-report
          path: artifacts/addressable_completion_bounds_report.json
          if-no-files-found: error
