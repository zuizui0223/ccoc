name: Joint open-candidate law certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/joint_open_candidate_laws.py'
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'scripts/verify_joint_open_candidate_laws.py'
      - 'tests/test_joint_open_candidate_laws.py'
      - 'tests/test_current_theory.py'
      - 'docs/joint_open_candidate_laws.md'
      - '.github/workflows/joint-open-candidate-laws.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/joint_open_candidate_laws.py'
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'scripts/verify_joint_open_candidate_laws.py'
      - 'tests/test_joint_open_candidate_laws.py'
      - 'tests/test_current_theory.py'
      - 'docs/joint_open_candidate_laws.md'
      - '.github/workflows/joint-open-candidate-laws.yml'

permissions:
  contents: read

jobs:
  theorem-certificate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install certificate replay dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replay joint open-candidate theorem certificates
        run: python -m pytest tests/test_joint_open_candidate_laws.py -q
      - name: Replay universal, typed, and joint-product families
        run: >-
          PYTHONPATH=. python scripts/verify_joint_open_candidate_laws.py
          --max-inside-cardinality 4
          --max-port-count 2
          --max-response-types 3
          --output artifacts/joint_open_candidate_laws_report.json
      - name: Upload joint open-candidate theorem report
        uses: actions/upload-artifact@v4
        with:
          name: joint-open-candidate-laws-report
          path: artifacts/joint_open_candidate_laws_report.json
          if-no-files-found: error
