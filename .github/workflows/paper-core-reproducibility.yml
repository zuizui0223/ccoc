name: Paper-core reproducibility

on:
  pull_request:
    paths:
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'causal_model/shared_grammar.py'
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/extension_compression.py'
      - 'causal_model/extension_compression_noncommutation.py'
      - 'causal_model/operational_addressability.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'causal_model/coherent_portable_macrolaw.py'
      - 'causal_model/conservative_macro_schema.py'
      - 'causal_model/portability_core.py'
      - 'scripts/verify_paper_core.py'
      - 'scripts/verify_theorem_registry.py'
      - 'tests/conftest.py'
      - 'tests/test_dynamic_boundary_blankets.py'
      - 'tests/test_shared_grammar.py'
      - 'tests/test_grammar_aware_blankets.py'
      - 'tests/test_extension_compression.py'
      - 'tests/test_operational_addressability.py'
      - 'tests/test_relay_tree_compilation.py'
      - 'tests/test_coherent_portable_macrolaw.py'
      - 'tests/test_conservative_macro_schema.py'
      - 'tests/test_public_theory_surfaces.py'
      - 'tests/test_paper_core_reproducibility.py'
      - 'tests/test_theorem_registry.py'
      - 'docs/portability_core_v1.md'
      - 'docs/manuscript_readiness_audit.md'
      - 'docs/addressable_completion_product_bound.md'
      - 'docs/paper_core_audit.md'
      - 'docs/theorem_registry.json'
      - 'docs/theorem_registry.md'
      - '.github/workflows/paper-core-reproducibility.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'causal_model/shared_grammar.py'
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/extension_compression.py'
      - 'causal_model/extension_compression_noncommutation.py'
      - 'causal_model/operational_addressability.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'causal_model/coherent_portable_macrolaw.py'
      - 'causal_model/conservative_macro_schema.py'
      - 'causal_model/portability_core.py'
      - 'scripts/verify_paper_core.py'
      - 'scripts/verify_theorem_registry.py'
      - 'tests/conftest.py'
      - 'tests/test_dynamic_boundary_blankets.py'
      - 'tests/test_shared_grammar.py'
      - 'tests/test_grammar_aware_blankets.py'
      - 'tests/test_extension_compression.py'
      - 'tests/test_operational_addressability.py'
      - 'tests/test_relay_tree_compilation.py'
      - 'tests/test_coherent_portable_macrolaw.py'
      - 'tests/test_conservative_macro_schema.py'
      - 'tests/test_public_theory_surfaces.py'
      - 'tests/test_paper_core_reproducibility.py'
      - 'tests/test_theorem_registry.py'
      - 'docs/portability_core_v1.md'
      - 'docs/manuscript_readiness_audit.md'
      - 'docs/addressable_completion_product_bound.md'
      - 'docs/paper_core_audit.md'
      - 'docs/theorem_registry.json'
      - 'docs/theorem_registry.md'
      - '.github/workflows/paper-core-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify paper-core registry provenance
        run: python scripts/verify_theorem_registry.py --check --write-report
      - name: Run paper-core regression tests
        run: >-
          python -m pytest
          tests/test_dynamic_boundary_blankets.py
          tests/test_shared_grammar.py
          tests/test_grammar_aware_blankets.py
          tests/test_extension_compression.py
          tests/test_operational_addressability.py
          tests/test_relay_tree_compilation.py
          tests/test_coherent_portable_macrolaw.py
          tests/test_conservative_macro_schema.py
          tests/test_public_theory_surfaces.py
          tests/test_paper_core_reproducibility.py
          tests/test_theorem_registry.py
          -q
      - name: Write finite paper-core replay report
        run: python scripts/verify_paper_core.py --write-report
      - name: Upload paper-core reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-core-reproducibility
          path: |
            artifacts/paper_core_reproducibility_report.json
            artifacts/theorem_registry_report.json
          if-no-files-found: error
