name: Common-mode canonical panel certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/canonical_boundary_blankets.py'
      - 'causal_model/robust_canonical_panels.py'
      - 'causal_model/common_mode_canonical_panels.py'
      - 'scripts/verify_common_mode_canonical_panels.py'
      - 'tests/test_common_mode_canonical_panels.py'
      - 'docs/common_mode_canonical_panels.md'
      - '.github/workflows/common-mode-canonical-panels.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/canonical_boundary_blankets.py'
      - 'causal_model/robust_canonical_panels.py'
      - 'causal_model/common_mode_canonical_panels.py'
      - 'scripts/verify_common_mode_canonical_panels.py'
      - 'tests/test_common_mode_canonical_panels.py'
      - 'docs/common_mode_canonical_panels.md'
      - '.github/workflows/common-mode-canonical-panels.yml'

permissions:
  contents: read

jobs:
  theorem-layers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: reduction_and_collapse
            selector: singleton or many_replicates
          - layer: site_architecture
            selector: site_bundle
          - layer: covers_and_packing
            selector: mode_cover or common_mode_failure or mode_disjoint or overlapping_mode
          - layer: fail_closed
            selector: mode_contract or modes_must or invalid_mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replay theorem layer
        run: >-
          python -m pytest tests/test_common_mode_canonical_panels.py -q
          -k "${{ matrix.selector }}"

  certificate-replay:
    needs: theorem-layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_common_mode_canonical_panels.py
          --max-replication 6
          --max-sites 5
          --max-replicates-per-site 4
          --output artifacts/common_mode_canonical_panels_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: common-mode-canonical-panels-report
          path: artifacts/common_mode_canonical_panels_report.json
          if-no-files-found: error
