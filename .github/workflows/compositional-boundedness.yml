name: Compositional boundedness criteria replay

on:
  pull_request:
    paths:
      - 'causal_model/compositional_boundedness.py'
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/extension_compression_noncommutation.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'tests/test_compositional_boundedness.py'
      - 'scripts/verify_compositional_boundedness.py'
      - 'docs/compositional_boundedness.md'
      - '.github/workflows/compositional-boundedness.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/compositional_boundedness.py'
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/extension_compression_noncommutation.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'tests/test_compositional_boundedness.py'
      - 'scripts/verify_compositional_boundedness.py'
      - 'docs/compositional_boundedness.md'
      - '.github/workflows/compositional-boundedness.yml'

permissions:
  contents: read

jobs:
  theorem-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run compositional boundedness tests
        run: python -m pytest tests/test_compositional_boundedness.py -q
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_compositional_boundedness.py
          --max-module-count 5
          --output artifacts/compositional_boundedness_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: compositional-boundedness-report
          path: artifacts/compositional_boundedness_report.json
          if-no-files-found: error
