name: Binary joint relay certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/binary_joint_relay_compilation.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'causal_model/joint_open_candidate_laws.py'
      - 'scripts/verify_binary_joint_relay_compilation.py'
      - 'tests/test_binary_joint_relay_compilation.py'
      - 'tests/test_current_theory.py'
      - 'docs/binary_joint_relay_compilation.md'
      - '.github/workflows/binary-joint-relay.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/binary_joint_relay_compilation.py'
      - 'causal_model/relay_tree_compilation.py'
      - 'causal_model/joint_open_candidate_laws.py'
      - 'scripts/verify_binary_joint_relay_compilation.py'
      - 'tests/test_binary_joint_relay_compilation.py'
      - 'tests/test_current_theory.py'
      - 'docs/binary_joint_relay_compilation.md'
      - '.github/workflows/binary-joint-relay.yml'

permissions:
  contents: read

jobs:
  certificate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run binary joint relay tests
        run: python -m pytest tests/test_binary_joint_relay_compilation.py -q
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_binary_joint_relay_compilation.py
          --max-exterior-port-count 5
          --output artifacts/binary_joint_relay_compilation_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: binary-joint-relay-report
          path: artifacts/binary_joint_relay_compilation_report.json
          if-no-files-found: error
