name: Grammar interface certificate replay

on:
  pull_request:
    paths:
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/delayed_addressability.py'
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'scripts/verify_grammar_aware_blankets.py'
      - 'tests/test_grammar_aware_blankets.py'
      - 'tests/test_current_theory.py'
      - 'docs/grammar_aware_dynamic_blankets.md'
      - '.github/workflows/grammar-interface.yml'
  push:
    branches: [main]
    paths:
      - 'causal_model/grammar_aware_blankets.py'
      - 'causal_model/delayed_addressability.py'
      - 'causal_model/dynamic_boundary_blankets.py'
      - 'scripts/verify_grammar_aware_blankets.py'
      - 'tests/test_grammar_aware_blankets.py'
      - 'tests/test_current_theory.py'
      - 'docs/grammar_aware_dynamic_blankets.md'
      - '.github/workflows/grammar-interface.yml'

permissions:
  contents: read

jobs:
  certificate-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run grammar interface tests
        run: python -m pytest tests/test_grammar_aware_blankets.py -q
      - name: Write deterministic replay report
        run: >-
          PYTHONPATH=. python scripts/verify_grammar_aware_blankets.py
          --max-delay 6
          --output artifacts/grammar_aware_blankets_report.json
      - name: Upload theorem report
        uses: actions/upload-artifact@v4
        with:
          name: grammar-interface-report
          path: artifacts/grammar_aware_blankets_report.json
          if-no-files-found: error
