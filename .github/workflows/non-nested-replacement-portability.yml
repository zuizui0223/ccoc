name: Legacy non-nested replacement replay

# This theorem branch is retained for historical replay but is outside the
# open-composition manuscript. Run it explicitly from the Actions UI when working
# on the legacy branch; do not make publication-core changes wait on it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run archived non-nested portability tests
        run: python -m pytest tests/test_non_nested_portability.py tests/test_non_nested_conservative_transport.py -q
      - name: Write deterministic archived replay report
        run: PYTHONPATH=. python scripts/verify_non_nested_replacement_portability.py
      - name: Upload archived theorem report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-non-nested-replacement-portability-report
          path: artifacts/non_nested_replacement_portability_report.json
          if-no-files-found: error
